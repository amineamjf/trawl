name: Amin AI APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Accept SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37" "platforms;android-36" || true
      - name: Native libraries
        run: |
          bash scripts/fetch-asr.sh
          curl -fL -o app/libs/onnxruntime-android-1.22.0.aar \
            https://repo1.maven.org/maven2/com/microsoft/onnxruntime/onnxruntime-android/1.22.0/onnxruntime-android-1.22.0.aar
          ls -la app/libs
      - name: Apply Amin AI patch
        run: |
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path("app/src/main/java/com/craneai/findr/ui/settings/FolderScopeEditor.kt")
          s = p.read_text()
          if "excelPicker" not in s:
              a1 = "  val excludePicker = rememberLauncherForActivityResult(ActivityResultContracts.OpenDocumentTree()) { pickedFolder(it, vm::excludeFolder) }\n"
              assert a1 in s, "anchor 1 missing"
              launcher = '''  val excelPicker = rememberLauncherForActivityResult(ActivityResultContracts.OpenMultipleDocuments()) { uris ->
            uris.forEach { u ->
              val folder = runCatching {
                val rel = DocumentsContract.getDocumentId(u).substringAfter(':', "").let { r ->
                  if (r.startsWith("/storage/")) r.substringAfter("/storage/emulated/0/", "") else r
                }
                rel.substringBeforeLast('/', "")
              }.getOrNull().orEmpty()
              if (folder.isNotEmpty()) vm.addFolder(folder) else pickerError = true
            }
          }
          '''
              s = s.replace(a1, a1 + launcher, 1)
              m = re.search(r"      Text\(stringResource\(R\.string\.scope_add\), style = SunType\.Label\)\n    \}\n", s)
              assert m, "anchor 2 missing"
              button = '''    SunOutlinedButton(
              onClick = { excelPicker.launch(arrayOf("application/vnd.openxmlformats-officedocument.spreadsheetml.sheet", "application/vnd.ms-excel", "text/csv", "text/comma-separated-values", "application/csv", "*/*")) },
              modifier = Modifier.fillMaxWidth().padding(top = Sun.S8),
            ) {
              Icon(Icons.Rounded.Description, contentDescription = null, modifier = Modifier.size(20.dp))
              Spacer(Modifier.width(Sun.S8))
              Text(stringResource(R.string.amin_add_excel), style = SunType.Label)
            }
          '''
              s = s[:m.end()] + button + s[m.end():]
              p.write_text(s)
          base = pathlib.Path("app/src/main/res")
          (base / "values/amin_strings.xml").write_text('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <string name="amin_add_excel">Add Excel or CSV files</string>\n</resources>\n')
          (base / "values-ar").mkdir(exist_ok=True)
          (base / "values-ar/amin_strings.xml").write_text('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <string name="amin_add_excel">إضافة ملفات Excel أو CSV</string>\n</resources>\n')
          PY
          grep -n "excelPicker" app/src/main/java/com/craneai/findr/ui/settings/FolderScopeEditor.kt
      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease -PappIdSuffix=.amin --no-daemon --stacktrace
      - name: Verify APK
        run: |
          APK=$(ls app/build/outputs/apk/full/release/*.apk | head -1)
          echo "APK=$APK"; ls -l "$APK"
          BT="$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)"
          "$BT/aapt2" dump badging "$APK" | grep -E "^package:|minSdkVersion|native-code"
          "$BT/apksigner" verify --print-certs "$APK"
          cp "$APK" amin-ai.apk
      - uses: actions/upload-artifact@v4
        with:
          name: amin-ai-apk
          path: amin-ai.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "amin-ai-run${{ github.run_number }}" amin-ai.apk \
            --title "Amin AI build ${{ github.run_number }}" \
            --notes "Trawl + Excel/CSV picker patch"
