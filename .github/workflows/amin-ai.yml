name: Amin AI APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Accept SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37" "platforms;android-36" || true
      - name: Native libraries
        run: |
          bash scripts/fetch-asr.sh
          curl -fL -o app/libs/onnxruntime-android-1.22.0.aar \
            https://repo1.maven.org/maven2/com/microsoft/onnxruntime/onnxruntime-android/1.22.0/onnxruntime-android-1.22.0.aar
          ls -la app/libs
      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease -PappIdSuffix=.amin --no-daemon --stacktrace
      - name: Verify APK
        run: |
          APK=$(ls app/build/outputs/apk/full/release/*.apk | head -1)
          echo "APK=$APK"; ls -l "$APK"
          BT="$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)"
          "$BT/aapt2" dump badging "$APK" | grep -E "^package:|minSdkVersion|native-code"
          "$BT/apksigner" verify --print-certs "$APK"
          cp "$APK" amin-ai.apk
      - uses: actions/upload-artifact@v4
        with:
          name: amin-ai-apk
          path: amin-ai.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "amin-ai-run${{ github.run_number }}" amin-ai.apk \
            --title "Amin AI build ${{ github.run_number }}" \
            --notes "Built from Trawl source (baseline, no patch)"
